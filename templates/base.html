<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Reserva Materiales{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% load static %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/inicio.css' %}">
</head>

<body>

    <nav class="navbar navbar-expand-lg" style="background-color:#d52b1e;">
        <div class="container-fluid px-4">

            <a class="navbar-brand fw-bold text-white fs-3" href="/">
                🏗️ ConstruStock
            </a>

            <form class="d-flex mx-4 flex-grow-1">
                <input class="form-control" type="search" placeholder="Buscar cemento, ladrillos, herramientas...">

                <button class="btn btn-dark ms-2">
                    🔍
                </button>
            </form>

            <div class="navbar-nav">
                <a class="nav-link text-white" href="/">
                    Inicio
                </a>

                <a class="nav-link text-white" href="{% url 'catalogo:materiales' %}">
                    Catalogo
                </a>

                <div class="dropdown">

                    <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">

                        👤 Cuenta

                    </button>

                    <ul class="dropdown-menu dropdown-menu-end">

                        {% if user.is_authenticated %}

                        <li>
                            <a class="dropdown-item" href="{% url 'usuarios:perfil' %}">
                                Mi Cuenta
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="{% url 'usuarios:logout' %}">
                                Cerrar Sesión
                            </a>
                        </li>

                        {% else %}

                        <li>
                            <a class="dropdown-item" href="{% url 'usuarios:login' %}">
                                Iniciar Sesión
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="{% url 'usuarios:registro' %}">
                                Registrarse
                            </a>
                        </li>

                        {% endif %}

                    </ul>

                </div>

                <a class="nav-link text-white position-relative" href="{% url 'catalogo:lista_sesion' %}">

                    <i class="bi bi-cart-fill"></i>

                    <span class="badge rounded-pill bg-warning text-dark">
                        {{ contador_materiales }}
                    </span>

                </a>
            </div>

        </div>
    </nav>

    <div class="bg-dark text-white text-center py-2">
        🚚 Envío gratis en compras superiores a $50.000
    </div>



    {% block content %}
    {% endblock %}

</body>

</html>
