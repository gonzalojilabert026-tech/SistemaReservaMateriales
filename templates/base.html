<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Reserva Materiales{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg" style="background-color:#d52b1e;">
        <div class="container-fluid px-4">

            <a class="navbar-brand fw-bold text-white fs-3" href="/">
                🏗️ ConstruStock
            </a>

            <form class="d-flex mx-4 flex-grow-1">
                <input class="form-control" type="search" placeholder="Buscar cemento, ladrillos, herramientas...">

                <button class="btn btn-dark ms-2">
                    🔍
                </button>
            </form>

            <div class="navbar-nav">
                <a class="nav-link text-white" href="/">
                    Inicio
                </a>

                <a class="nav-link text-white" href="/catalogo/">
                    Materiales
                </a>

                <a class="nav-link text-white" href="/usuarios/login/">
                    Ingresar
                </a>
            </div>

        </div>
    </nav>

    <div class="container-fluid p-0">

        <div class="bg-dark text-white text-center py-2">
            🔥 Descuento de hasta 30% en Cemento, Fierro y Herramientas
        </div>

        <div class="position-relative">

            <img src="https://images.unsplash.com/photo-1504307651254-35680f356dfd" class="img-fluid w-100"
                style="height:400px; object-fit:cover;">

            <div class="position-absolute top-50 start-50 translate-middle text-center text-white">

                <h1 class="display-3 fw-bold">
                    Reserva tus Materiales
                </h1>

                <p class="lead">
                    Cemento, ladrillos, herramientas y más.
                </p>

                <a href="/catalogo/" class="btn btn-danger btn-lg">
                    Ver Catálogo
                </a>

            </div>

        </div>

    </div>

    <div class="container mt-5">

        <h2 class="text-center mb-4">
            Categorías Destacadas
        </h2>

        <div class="row">

            <div class="col-md-3">
                <div class="card shadow">
                    <div class="card-body text-center">
                        🧱
                        <h5>Cemento</h5>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow">
                    <div class="card-body text-center">
                        🏠
                        <h5>Ladrillos</h5>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow">
                    <div class="card-body text-center">
                        🔨
                        <h5>Herramientas</h5>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow">
                    <div class="card-body text-center">
                        🎨
                        <h5>Pinturas</h5>
                    </div>
                </div>
            </div>

        </div>

    </div>



    {% block content %}
    {% endblock %}

</body>

</html>
