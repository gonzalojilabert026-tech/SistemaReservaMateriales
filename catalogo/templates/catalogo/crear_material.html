{% extends 'base.html' %}

{% block contenido %}

<h1 class="mb-4">Crear Material</h1>

<div class="card">

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-success">

                Guardar

            </button>

            <a
                href="{% url 'materiales' %}"
                class="btn btn-secondary">

                Volver

            </a>

        </form>

    </div>

</div>

{% endblock %}
