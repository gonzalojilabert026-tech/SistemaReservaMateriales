{% extends 'base.html' %}

{% block contenido %}

<h1 class="mb-4">Lista de Materiales</h1>

<form method="GET" class="mb-4">

    <div class="input-group">

        <input
            type="text"
            name="buscar"
            class="form-control"
            placeholder="Buscar material">

        <button
            class="btn btn-primary"
            type="submit">

            Buscar

        </button>

    </div>

</form>

<a
    href="{% url 'crear_material' %}"
    class="btn btn-success mb-4">

    Crear Material

</a>

{% for material in materiales %}

<div class="card mb-3">

    <div class="card-body">

        <h4>{{ material.nombre }}</h4>

        <p>
            Stock: {{ material.stock }}
        </p>

        <p>
            Categoría: {{ material.categoria }}
        </p>

        <a
            href="{% url 'detalle_material' material.id %}"
            class="btn btn-info">

            Ver

        </a>

        <a
            href="{% url 'editar_material' material.id %}"
            class="btn btn-warning">

            Editar

        </a>

        <a
            href="{% url 'eliminar_material' material.id %}"
            class="btn btn-danger">

            Eliminar

        </a>

    </div>

</div>

{% endfor %}

{% endblock %}
