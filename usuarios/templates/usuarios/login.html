{% extends 'base.html' %}

{% block contenido %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body">

                <h1 class="mb-4 text-center">
                    Iniciar Sesión
                </h1>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-primary">

                            Ingresar

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
