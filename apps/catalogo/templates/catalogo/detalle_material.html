{% extends 'base.html' %}

{% block contenido %}

<div class="card">

    <div class="card-body">

        <h1>{{ material.nombre }}</h1>

        <hr>

        <p>
            <strong>Descripción:</strong>
            {{ material.descripcion }}
        </p>

        <p>
            <strong>Stock:</strong>
            {{ material.stock }}
        </p>

        <p>
            <strong>Precio:</strong>
            {{ material.precio_referencia }}
        </p>

        <p>
            <strong>Categoría:</strong>
            {{ material.categoria }}
        </p>

        <a
            href="{% url 'materiales' %}"
            class="btn btn-primary">

            Volver

        </a>

    </div>

</div>

{% endblock %}
