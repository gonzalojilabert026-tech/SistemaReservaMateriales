{% extends 'base.html' %}

{% block contenido %}

<div class="card border-danger">

    <div class="card-body">

        <h1 class="text-danger">
            Eliminar Material
        </h1>

        <hr>

        <p>
            ¿Desea eliminar el material
            <strong>{{ material.nombre }}</strong>?
        </p>

        <form method="post">

            {% csrf_token %}

            <button
                type="submit"
                class="btn btn-danger">

                Eliminar

            </button>

            <a
                href="{% url 'materiales' %}"
                class="btn btn-secondary">

                Cancelar

            </a>

        </form>

    </div>

</div>

{% endblock %}
