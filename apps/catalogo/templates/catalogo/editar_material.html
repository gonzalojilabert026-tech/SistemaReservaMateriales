{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4" style="text-align: center;">Editar Material</h1>

<div class="card">

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-warning">

                Actualizar

            </button>

            <a
                href="{% url 'catalogo:materiales' %}"
                class="btn btn-secondary">

                Volver

            </a>

        </form>

    </div>

</div>

{% endblock %}
