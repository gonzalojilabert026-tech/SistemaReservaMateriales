{% extends 'base.html' %}

{% block contenido %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card">

            <div class="card-body">

                <h1 class="mb-4">
                    Registro de Usuario
                </h1>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-success">

                        Registrarse

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
