{% extends 'base.html' %}

{% block contenido %}

<div class="card">

    <div class="card-body">

        <h1 class="mb-4">
            Perfil de Usuario
        </h1>

        <p>
            <strong>Usuario:</strong>
            {{ user.username }}
        </p>

        <p>
            <strong>Correo:</strong>
            {{ user.email }}
        </p>

        <p>
            <strong>Estado:</strong>
            Autenticado
        </p>

        <hr>

        <a
            href="/catalogo/"
            class="btn btn-primary">

            Ir al Catálogo

        </a>

        <a
            href="/admin/"
            class="btn btn-dark">

            Panel Admin

        </a>

        <a
            href="{% url 'logout' %}"
            class="btn btn-danger">

            Cerrar sesión

        </a>

    </div>

</div>

{% endblock %}
