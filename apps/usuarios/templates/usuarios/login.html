{% extends 'base.html' %}

{% block title %}
Iniciar Sesión
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-header bg-danger text-white">

                    <h3>Iniciar Sesión</h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button
                        type="submit"
                        class="btn btn-danger">

                        Ingresar

                        </button>

                    </form>

                    <hr>

                    <a
                    href="/"
                    class="btn btn-secondary">

                    Volver al Inicio

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
